"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  pixel(id: String!): pixel
  pixels(where: pixelFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): pixelPage!
  globalStats(id: String!): globalStats
  globalStatss(where: globalStatsFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): globalStatsPage!
  tradeEvent(id: String!): tradeEvent
  tradeEvents(where: tradeEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): tradeEventPage!
  burnerStats(address: String!): burnerStats
  burnerStatss(where: burnerStatsFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): burnerStatsPage!
  airdropStats(id: String!): airdropStats
  airdropStatss(where: airdropStatsFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int, offset: Int): airdropStatsPage!
  _meta: Meta
}

